<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="#10243d" name="theme-color"/>
  <title>
   STACKLY | Page not found
  </title>
  <link href="common.css" rel="stylesheet"/>
  <link href="404.css" rel="stylesheet"/>
 </head>
 <body>
  <main class="error-page">
   <div class="error-image image-rotator" data-images="assets/home hero.webp|assets/destination/destination hero.webp|assets/hotels/hotel hero.webp">

   </div>
   <div class="error-shade">
   </div>
   <section class="error-content">
    <a class="error-brand" href="index.html">
     <img alt="STACKLY" src="assets/stackly logo.webp"/>

    <span class="error-kicker">
     OFF THE MAP, NOT OFF THE JOURNEY
    </span>
    <div class="error-code">
     404
    </div>

     Looks like this page took a detour.
    </h1>

     The page you&rsquo;re looking for may have moved, or the link may be taking an unexpected route. Let&rsquo;s get your journey back on track.
    </p>
    <div class="error-actions">
     <a class="btn btn-light" href="index.html">
      &larr; Back to Home
     </a>
     <a class="btn" href="support.html">
      Contact Support &nearrow;
     </a>
    </div>
    <div class="error-foot">
     STACKLY &middot; Find your next somewhere
    </div>
   </section>
   <div aria-hidden="true" class="error-orbit">
    ✈
   </div>
  </main>
  <script src="common.js">
  </script>
 </body>
</html>
