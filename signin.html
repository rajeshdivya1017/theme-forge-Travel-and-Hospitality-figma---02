<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   STACKLY | Sign In
  </title>
  <link href="common.css" rel="stylesheet"/>
  <link href="auth.css" rel="stylesheet"/>
 </head>
 <body>
  <main class="auth-shell">
   <div class="auth-bg image-rotator" data-images="assets/home hero.webp|assets/destination/destination hero.webp|assets/hotels/hotel hero.webp">
    <img alt="Travel destination" src="assets/home hero.webp"/>
   </div>
   <div class="auth-topnote">
    <span>Sign In</span>
    <a class="auth-home-link" href="index.html" aria-label="Back to STACKLY home">← Back to Home</a>
   </div>
   <section class="auth-panel">
    <h1>
     Welcome back
    </h1>
    <p>
     Sign in to your STACKLY account.
    </p>
    <form id="authForm">
     <label class="auth-field">
      Email address
      <input autocomplete="email" name="email" placeholder="you@example.com" required="" type="email"/>
     </label>
     <label class="auth-field">
      Password
      <span class="password-wrap">
       <input autocomplete="current-password" minlength="8" name="password" placeholder="Enter your password" required="" type="password"/>
       <button aria-label="Show password" class="password-toggle" type="button">
        ◉
       </button>
      </span>
     </label>
     <div class="auth-row">
      <label class="auth-check">
       <input type="checkbox"/>
       Remember me on this device
      </label>
      <a class="auth-link" href="forgot-password.html">
       Forgot Password?
      </a>
     </div>
     <button class="auth-submit">
      Sign In
     </button>
     <p class="auth-switch">
      New to STACKLY?
      <br/>
      <a class="auth-link" href="signup.html">
       Create Account
      </a>
     </p>
    </form>
    <div aria-live="polite" class="auth-message" id="authMessage">
    </div>
   </section>
   <div class="auth-footer">
    <a href="#">
     Privacy
    </a>
    <a href="#">
     Terms
    </a>
    <a href="support.html">
     Help
    </a>
   </div>
  </main>
  <script src="common.js">
  </script>
  <script src="auth.js">
  </script>
 </body>
</html>
