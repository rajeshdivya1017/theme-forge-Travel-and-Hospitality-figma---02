<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   STACKLY | Forgot Password
  </title>
  <link href="common.css" rel="stylesheet"/>
  <link href="auth.css" rel="stylesheet"/>
 </head>
 <body>
  <main class="auth-shell">
   <div class="auth-bg image-rotator" data-images="assets/hotels/hotel intro.webp|assets/booking/booking hero.webp|assets/about/about hero.webp">
    <img alt="Travel destination" src="assets/hotels/hotel intro.webp"/>
   </div>
   <div class="auth-topnote">
    <span>Forgot Password</span>
    <a class="auth-home-link" href="index.html" aria-label="Back to STACKLY home">← Back to Home</a>
   </div>
   <section class="auth-panel">
    <h1>
     Forgot your password?
    </h1>
    <p>
     Enter the email you used for STACKLY. We&rsquo;ll send instructions to reset your password.
    </p>
    <form id="authForm">
     <label class="auth-field">
      Email address
      <input autocomplete="email" name="email" placeholder="you@example.com" required="" type="email"/>
     </label>
     <button class="auth-submit">
      Send Reset Link
     </button>
     <p class="auth-switch">
      <a class="auth-link" href="signin.html">
       Back to Sign In
      </a>
     </p>
    </form>
    <div aria-live="polite" class="auth-message" id="authMessage">
    </div>
   </section>
   <div class="auth-footer">
    <a href="#">
     Privacy
    </a>
    <a href="#">
     Terms
    </a>
    <a href="support.html">
     Help
    </a>
   </div>
  </main>
  <script src="common.js">
  </script>
  <script src="auth.js">
  </script>
 </body>
</html>
